version: '3.8'

services:
  db:
    image: postgres:16.3
    container_name: go-learn-db
    environment:
      POSTGRES_DB: golearn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data:
